<html lang="en">

<head>

        /* .el-popover {

</head>

<script>
    var httpRequest = new XMLHttpRequest();//第一步：建立所需的对象
    console.log("<%= BASE_URL %>")
    httpRequest.open('GET', "stage-api/system/direct/resource/getByCodeText?page=index&code=1", true);//第二步：打开连接  将请求参数写在url中  ps:"./Ptest.php?name=test&nameone=testone"
    httpRequest.send();//第三步：发送请求  将请求参数写在URL中
    // 获取数据后的处理程序
    httpRequest.onreadystatechange = function () {
        if (httpRequest.readyState == 4 && httpRequest.status == 200) {
            document.getElementById("title").innerHTML = httpRequest.responseText;//获取到json字符串，还需解析
        }
    };

</script>
